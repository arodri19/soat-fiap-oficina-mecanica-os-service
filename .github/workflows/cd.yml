name: CD — Deploy automatizado no Kubernetes (EKS)

# Fase 4: deploy AUTOMÁTICO a cada merge (push) em homologacao/main — o merge só
# acontece via PR com o CI verde (branches protegidas). Também pode ser disparado
# manualmente (workflow_dispatch), ex.: para reimplantar uma tag específica.
#
# Infra sob demanda (ver ADR 0007 da Fase 3): se o cluster EKS do ambiente não
# existir no momento do merge, a imagem é publicada mesmo assim e o deploy no
# cluster é PULADO com aviso — em vez de falhar ou provisionar infraestrutura cara
# automaticamente.
#
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
#          DB_PASSWORD, JWT_SECRET, NEW_RELIC_LICENSE_KEY, NEWRELIC_API_KEY, SONAR_TOKEN
# Variables: AWS_REGION, TF_STATE_BUCKET, DEPLOY_ENVIRONMENT, NEWRELIC_ACCOUNT_ID,
#            SONAR_HOST_URL, SONAR_ORGANIZATION
on:
  push:
    branches: [main, homologacao]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente alvo'
        required: true
        default: 'dev'
        type: choice
        options: [dev, staging, prod]

concurrency:
  group: cd-os-service-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TARGET_ENV: ${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }}
  DOCKERHUB_REPOSITORY: arodri19/oficina-os-service
  NAMESPACE: oficina-mecanica

jobs:
  # ── 1. Testes + qualidade (o mesmo CI dos PRs) ───────────────────────────────
  ci:
    name: CI (testes, cobertura, SonarQube)
    uses: ./.github/workflows/ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 2. Build e push da imagem ────────────────────────────────────────────────
  build-and-push:
    name: Build e push no Docker Hub
    runs-on: ubuntu-latest
    needs: ci
    environment: oficina-prd
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7.0.1

      - name: Login no Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcular tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "image=${{ env.DOCKERHUB_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "short=${{ env.DOCKERHUB_REPOSITORY }}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${{ env.DOCKERHUB_REPOSITORY }}:${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build e push
        run: |
          docker build --target production \
            --tag "${{ steps.meta.outputs.image }}" \
            --tag "${{ steps.meta.outputs.short }}" \
            --tag "${{ steps.meta.outputs.branch }}" \
            --tag "${{ env.DOCKERHUB_REPOSITORY }}:latest" .
          docker push --all-tags "${{ env.DOCKERHUB_REPOSITORY }}"

  # ── 3. Infra própria do serviço + deploy no EKS ──────────────────────────────
  deploy:
    name: Deploy no EKS (${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }})
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: oficina-prd
    env:
      EKS_CLUSTER_NAME: oficina-mecanica-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }}
      RDS_IDENTIFIER: oficina-mecanica-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }}-postgres
      QUEUE_PREFIX: oficina-mecanica-${{ github.event.inputs.environment || vars.DEPLOY_ENVIRONMENT || 'dev' }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7.0.1

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar se o cluster e o banco existem
        id: infra
        run: |
          if aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier "$RDS_IDENTIFIER" \
              --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || true)
            if [ -z "$ENDPOINT" ] || [ "$ENDPOINT" = "None" ]; then
              echo "::warning::Cluster existe mas o RDS '$RDS_IDENTIFIER' não — rode o pipeline do infra-data. Deploy pulado."
              echo "ready=false" >> "$GITHUB_OUTPUT"
            else
              echo "RDS_ENDPOINT=$ENDPOINT" >> "$GITHUB_ENV"
              echo "ready=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Cluster '$EKS_CLUSTER_NAME' não existe (infra sob demanda desligada). Imagem publicada; deploy no cluster pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.infra.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '~1.9'

      # Fila de respostas da saga (+ DLQ) e policy IAM deste serviço.
      - name: Terraform apply — filas SQS e IAM do os-service
        if: steps.infra.outputs.ready == 'true'
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET || 'oficina-mecanica-terraform-state-769628268406' }}" \
            -backend-config="key=oficina-mecanica/os-service/${TARGET_ENV}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -input=false -auto-approve \
            -var="environment=$TARGET_ENV" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET || 'oficina-mecanica-terraform-state-769628268406' }}"

      - name: Configurar kubectl
        if: steps.infra.outputs.ready == 'true'
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Aplicar namespace, ConfigMap e Secret
        if: steps.infra.outputs.ready == 'true'
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed -i "s|QUEUE_PREFIX: \".*\"|QUEUE_PREFIX: \"$QUEUE_PREFIX\"|" k8s/configmap.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl create secret generic os-service-secrets \
            --namespace="$NAMESPACE" \
            --from-literal=DATABASE_URL="postgresql://postgres:${{ secrets.DB_PASSWORD }}@${RDS_ENDPOINT}/oficina?schema=public" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --from-literal=NEW_RELIC_ACCOUNT_ID="${{ vars.NEWRELIC_ACCOUNT_ID }}" \
            --from-literal=NEW_RELIC_API_KEY="${{ secrets.NEWRELIC_API_KEY }}" \
            --dry-run=client -o yaml > "$RUNNER_TEMP/os-service-secrets.yaml"
          kubectl apply -f "$RUNNER_TEMP/os-service-secrets.yaml"

      - name: metrics-server (necessário para o HPA)
        if: steps.infra.outputs.ready == 'true'
        run: kubectl apply -f k8s/metrics-server.yaml

      - name: Aplicar Deployment, Services e HPA (imagem ${{ env.DOCKERHUB_REPOSITORY }}:${{ github.sha }})
        if: steps.infra.outputs.ready == 'true'
        run: |
          # checksum de ConfigMap + Secret no pod: reexecutar o CD só com configuração
          # nova (mesma imagem) também recria os pods
          CONFIG_HASH=$(cat k8s/configmap.yaml "$RUNNER_TEMP/os-service-secrets.yaml" | sha256sum | cut -c1-16)
          sed -i "s|arodri19/oficina-os-service:[^ ]*|${{ env.DOCKERHUB_REPOSITORY }}:${{ github.sha }}|g; s|CONFIG_HASH|$CONFIG_HASH|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml -f k8s/hpa.yaml
          kubectl rollout status deployment/os-service -n "$NAMESPACE" --timeout=300s

      - name: Seed inicial (só em banco vazio)
        if: steps.infra.outputs.ready == 'true'
        run: |
          POD=$(kubectl get pods -n "$NAMESPACE" -l app=os-service --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n "$NAMESPACE" "$POD" -- node prisma/seed.js --if-empty

      - name: Smoke test (/health dentro do cluster)
        if: steps.infra.outputs.ready == 'true'
        run: |
          kubectl run smoke-os-${{ github.run_id }} -n "$NAMESPACE" --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- -sf http://os-service/health

      - name: Resumo do deploy
        if: always()
        run: |
          HOST=$(kubectl get svc os-service-public -n "$NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
          {
            echo "### Deploy os-service — ${{ job.status }}"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Imagem | \`${{ env.DOCKERHUB_REPOSITORY }}:${{ github.sha }}\` |"
            echo "| Ambiente | \`$TARGET_ENV\` |"
            echo "| Cluster pronto | \`${{ steps.infra.outputs.ready }}\` |"
            [ -n "$HOST" ] && echo "| Swagger | http://$HOST/api-docs |"
            true
          } >> "$GITHUB_STEP_SUMMARY"
