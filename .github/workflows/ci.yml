name: CI — Build, Testes e Qualidade

# Roda em todo push de branch de trabalho e em todo PR para main/homologacao.
# As branches main e homologacao são protegidas: o merge exige este workflow verde
# (checks "Testes + Cobertura + SonarQube" e "Build da imagem Docker").
# Também é reutilizado pelo CD (workflow_call) — nenhuma imagem é publicada sem
# os testes passarem.
on:
  push:
    branches-ignore: [main, homologacao]
  pull_request:
    branches: [main, homologacao]
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  test:
    name: Testes + Cobertura + SonarQube
    runs-on: ubuntu-latest

    # PostgreSQL real para os testes de integração dos repositórios Prisma,
    # do Unit of Work (OS + saga + outbox numa transação) e do lock otimista.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oficina_test?schema=public
      JWT_SECRET: ci-secret-placeholder
      RUN_DB_TESTS: 'true'
      NEW_RELIC_ENABLED: 'false'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # SonarQube precisa do histórico para "new code"

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client e aplicar migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      # Unitários + BDD (jest-cucumber) + integração com PostgreSQL.
      # coverageThreshold (jest.config.js) faz o job FALHAR abaixo de 80%.
      - name: Testes com cobertura (mínimo 80%)
        run: npm run test:ci

      - name: Resumo de cobertura
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('### Cobertura de testes — os-service');
              console.log('| Métrica | % |');
              console.log('|---------|---|');
              ['lines','statements','functions','branches'].forEach(k => console.log('| ' + k + ' | ' + s[k].pct + '% |'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-os-service
          path: coverage/
          retention-days: 14

      # Quality Gate do SonarQube/SonarCloud: sonar.qualitygate.wait=true faz o
      # step falhar se o gate reprovar (bugs, vulnerabilidades, cobertura de código novo...).
      - name: Verificar configuração do SonarQube
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SONAR_TOKEN não configurado — análise SonarQube ignorada."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Análise SonarQube + Quality Gate
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'arodri19' }}
            -Dsonar.qualitygate.wait=true

  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v7.0.1

      - name: Build (sem push) — valida o Dockerfile
        run: docker build --target production -t oficina-os-service:ci .
